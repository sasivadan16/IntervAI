<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | IntervAI</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-body"><a class="brand auth-brand" href="index.html"><span class="brand-mark">✦</span>Interv<span class="accent">AI</span></a>
<main class="auth-card"><a class="back-link" href="index.html">← Back to home</a><span class="kicker">GET STARTED</span><h1>Create your account</h1><p class="muted">Set up your interview practice space.</p>
