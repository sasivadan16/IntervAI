<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10152b">
<title>IntervAI | Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0c1123;--surface:#151c35;--purple:#8875f5;--purple2:#a99bff;--white:#fff;--muted:#a6aec7;--border:rgba(255,255,255,.09)}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;padding:24px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,rgba(118,93,233,.17),transparent 55%),var(--bg);color:var(--white);font-family:'DM Sans',sans-serif}
a{color:inherit;text-decoration:none}
.card{width:min(100%,440px);padding:38px;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:0 24px 80px rgba(0,0,0,.28)}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:32px;font-family:Manrope,sans-serif;font-size:23px;font-weight:800}
.logo-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,#a294ff,#6954d9)}
.logo span{color:var(--purple2)}
h1{margin:0 0 8px;text-align:center;font-family:Manrope,sans-serif;font-size:28px}
.subtitle{margin:0 0 28px;text-align:center;color:var(--muted);font-size:14px}
label{display:block;margin:17px 0 7px;font-size:13px;font-weight:700}
input{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:9px;background:#10172d;color:white;font:inherit;outline:none}
input:focus{border-color:var(--purple)}
.submit{width:100%;margin-top:24px;padding:13px;border:0;border-radius:9px;background:linear-gradient(135deg,#8c79f6,#6956db);color:white;font:700 15px 'DM Sans',sans-serif;cursor:pointer}
.submit:disabled{opacity:.7;cursor:wait}
.message{min-height:20px;margin:12px 0 0;color:#ff9b9b;font-size:13px}
.switch{margin:18px 0 0;text-align:center;color:var(--muted);font-size:14px}
.switch a,.back{color:var(--purple2);font-weight:700}
.back{display:block;margin-top:24px;text-align:center;font-size:13px}
[hidden]{display:none!important}
@media(max-width:480px){.card{padding:28px 22px}}
</style>
</head>
<body>
<main class="card">
    <a class="logo" href="/"><span class="logo-icon">✦</span><span style="color:white">Interv<span>AI</span></span></a>
    <h1 id="heading">Welcome back</h1>
    <p class="subtitle" id="subtitle">Sign in to continue your interview practice.</p>
    <form id="authForm">
        <div id="nameField" hidden>
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" maxlength="80">
        </div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="1024" required>
        <button class="submit" id="submitButton" type="submit">Sign in</button>
        <p class="message" id="message" role="alert" aria-live="polite"></p>
    </form>
    <p class="switch" id="switchText"></p>
    <a class="back" href="/">← Back to IntervAI</a>
</main>
<script>
const isSignup = window.location.pathname === "/signup.html";
const form = document.getElementById("authForm");
const nameField = document.getElementById("nameField");
const password = document.getElementById("password");
const submitButton = document.getElementById("submitButton");
const message = document.getElementById("message");

document.title = isSignup ? "IntervAI | Create account" : "IntervAI | Sign in";
document.getElementById("heading").textContent = isSignup ? "Create your account" : "Welcome back";
document.getElementById("subtitle").textContent = isSignup
    ? "Start building confidence for your next interview."
    : "Sign in to continue your interview practice.";
nameField.hidden = !isSignup;
document.getElementById("name").required = isSignup;
password.autocomplete = isSignup ? "new-password" : "current-password";
submitButton.textContent = isSignup ? "Create account" : "Sign in";
const switchText = document.getElementById("switchText");
switchText.append(document.createTextNode(isSignup ? "Already have an account? " : "New to IntervAI? "));
const switchLink = document.createElement("a");
switchLink.href = isSignup ? "/login.html" : "/signup.html";
switchLink.textContent = isSignup ? "Sign in" : "Create an account";
switchText.append(switchLink);

form.addEventListener("submit", async event => {
    event.preventDefault();
    message.textContent = "";
    submitButton.disabled = true;
    submitButton.textContent = isSignup ? "Creating account…" : "Signing in…";

    const data = Object.fromEntries(new FormData(form));
    try {
        const response = await fetch(isSignup ? "/api/signup" : "/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Something went wrong.");
        window.location.assign("/");
    } catch (error) {
        message.textContent = error.message || "Could not connect to the server. Please try again.";
        submitButton.disabled = false;
        submitButton.textContent = isSignup ? "Create account" : "Sign in";
    }
});
</script>
</body>
</html>
