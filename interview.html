<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mock Interview | IntervAI</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="navbar"><a class="brand" href="index.html"><span class="brand-mark">✦</span>Interv<span class="accent">AI</span></a><nav><a href="dashboard.html">Dashboard</a><a href="interview.html">Mock interview</a></nav><div class="nav-actions"><a class="login-link" href="dashboard.html">Back to dashboard</a></div></header>
<main class="interview-page wrap"><span class="kicker">PRACTICE ARENA</span><h1>Mock interview</h1><p class="muted">Choose a role and difficulty, then answer the question in your own words.</p>
<div class="interview-panel"><div class="form-grid"><label>Target role<select id="role"><option>Java Developer</option><option>Python Developer</option><option>Frontend Developer</option><option>Data Analyst</option><option>Machine Learning Engineer</option></select></label><label>Difficulty<select id="level"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label></div>
<button class="btn" id="loadQuestion">Get interview question</button><div class="question-box"><span class="kicker">YOUR QUESTION</span><p id="question">Select your role and click “Get interview question” to begin.</p></div>
<label class="answer-label" for="answer">Your answer</label><textarea id="answer" rows="7" placeholder="Type your answer here..."></textarea><button class="btn" id="submitAnswer">Submit answer</button><p id="feedback" class="feedback" role="status"></p></div></main><script src="js/interview.js"></script></body></html>
